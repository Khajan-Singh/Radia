name: Release

# Pushing a v* tag (normally via `npm run release`) builds the installer and
# publishes a GitHub release with the matching CHANGELOG section as its notes.
# latest.yml and the blockmap go up with the installer: electron-updater in
# installed copies reads them to find and download the next version.

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match package.json version $v" }

      # signAndEditExecutable is off in package.json because electron-builder's
      # winCodeSign bundle cannot be extracted on a machine without Developer
      # Mode (macOS symlinks inside it). The runner can, and without this step
      # Radia.exe keeps Electron's atom icon on shortcuts and the taskbar.
      - run: npm run build; npm run build:bridge; npx electron-builder --win nsis --publish never --config.win.signAndEditExecutable=true

      - name: Release notes from the changelog
        run: node scripts/release-notes.mjs "$env:GITHUB_REF_NAME" | Out-File -Encoding utf8 notes.md

      - name: Create the GitHub release
        run: |
          $exe = (Get-Item dist/Radia-*-setup.exe).FullName
          gh release create "$env:GITHUB_REF_NAME" $exe "$exe.blockmap" dist/latest.yml --title "Radia $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
