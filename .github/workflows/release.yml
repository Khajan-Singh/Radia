name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: npm ci
      - run: npm run package
      - run: gh release create "$env:GITHUB_REF_NAME" (Get-Item dist/Radia-*-setup.exe).FullName --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
